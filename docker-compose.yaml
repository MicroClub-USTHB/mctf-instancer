services:
  redis:
    image: redis:7-alpine
    container_name: whaley-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ctf-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: whaley-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-whaley}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-whaley}
      - POSTGRES_DB=${POSTGRES_DB:-whaley}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ctf-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-whaley} -d $${POSTGRES_DB:-whaley}"]
      interval: 5s
      timeout: 3s
      retries: 5

  instancer:
    build: .
    container_name: ctf-instancer
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${INSTANCER_PORT:-8000}:8000"
    volumes:
      # Mount Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount challenges directory (read-write for Challenge Manager)
      - ./challenges:/challenges
      # Mount logs directory
      - ./logs:/app/logs
      # Mount data directory for forensics, event logs, etc.
      - ./data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=${DEBUG:-false}
      - AUTH_MODE=${AUTH_MODE:-none}
      - CTFD_URL=${CTFD_URL:-https://localhost}
      - CTFD_API_KEY=${CTFD_API_KEY:-}  # Required if AUTH_MODE=ctfd
      - ADMIN_KEY=${ADMIN_KEY:-}  # Required - generate with: openssl rand -hex 32
      - ADMIN_PATH=${ADMIN_PATH:-admin}
      - METRICS_SECRET=${METRICS_SECRET:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - CHALLENGES_DIR=/challenges
      - PORT_RANGE_START=${PORT_RANGE_START:-10000}
      - PORT_RANGE_END=${PORT_RANGE_END:-60000}
      - MAX_INSTANCES_PER_USER=${MAX_INSTANCES_PER_USER:-3}
      - MAX_INSTANCES_PER_TEAM=${MAX_INSTANCES_PER_TEAM:-5}
      - INSTANCE_TIMEOUT=${INSTANCE_TIMEOUT:-600}
      - PUBLIC_HOST=${PUBLIC_HOST:-auto}
      - DYNAMIC_FLAGS_ENABLED=${DYNAMIC_FLAGS_ENABLED:-false}
      - FLAG_PREFIX=${FLAG_PREFIX:-FLAG}
      - TEAM_MODE=${TEAM_MODE:-auto}
      # Database settings (PostgreSQL)
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-whaley}:${POSTGRES_PASSWORD:-whaley}@postgres:5432/${POSTGRES_DB:-whaley}
      - DATA_DIR=/app/data
      # Redis for distributed locking
      - REDIS_URL=redis://redis:6379/0
      # Traefik Redis KV provider (shared with Traefik VM)
      - TRAEFIK_REDIS_ENABLED=${TRAEFIK_REDIS_ENABLED:-true}
      - TRAEFIK_REDIS_URL=${TRAEFIK_REDIS_URL:-redis://redis:6379/0}
      - TRAEFIK_BASE_DOMAIN=${TRAEFIK_BASE_DOMAIN:-ctf.example}
      - TRAEFIK_BACKEND_HOST=${TRAEFIK_BACKEND_HOST:-challenges-vm}
      - TRAEFIK_HTTP_ENTRYPOINT=${TRAEFIK_HTTP_ENTRYPOINT:-websecure}
      - TRAEFIK_TCP_ENTRYPOINT=${TRAEFIK_TCP_ENTRYPOINT:-tcp-challenges}
      - TRAEFIK_TCP_EXTERNAL_PORT=${TRAEFIK_TCP_EXTERNAL_PORT:-5443}
      - TRAEFIK_HTTP_TLS_OPTIONS=${TRAEFIK_HTTP_TLS_OPTIONS:-default}
      - TRAEFIK_TCP_TLS_OPTIONS=${TRAEFIK_TCP_TLS_OPTIONS:-tcp-default}
      - TRAEFIK_BLOCK_ALL_ADDRESS=${TRAEFIK_BLOCK_ALL_ADDRESS:-127.0.0.1:9}
      - TRAEFIK_DASHBOARD_USERS=${TRAEFIK_DASHBOARD_USERS:-}
      - TRAEFIK_PERMANENT_KEYS_FILE=${TRAEFIK_PERMANENT_KEYS_FILE:-}
      - TRAEFIK_PERMANENT_KEYS_JSON=${TRAEFIK_PERMANENT_KEYS_JSON:-}
      # Network isolation
      - NETWORK_ISOLATION_ENABLED=${NETWORK_ISOLATION_ENABLED:-true}
      - NETWORK_ICC_DISABLED=${NETWORK_ICC_DISABLED:-true}
      - NETWORK_PREFIX=whaley
      # Instance Forensics settings
      - FORENSICS_AUTO_CAPTURE=${FORENSICS_AUTO_CAPTURE:-false}
      - FORENSICS_MAX_SIZE_MB=${FORENSICS_MAX_SIZE_MB:-5}
      - FORENSICS_TAIL_LINES=${FORENSICS_TAIL_LINES:-1000}
      - FORENSICS_RETENTION_HOURS=${FORENSICS_RETENTION_HOURS:-168}
      - FORENSICS_COMPRESSION=${FORENSICS_COMPRESSION:-true}
    restart: unless-stopped
    networks:
      - ctf-network
    extra_hosts:
      - "${EXTRA_HOST_NAME:-main-vm}:${EXTRA_HOST_IP:-10.0.0.2}"  # For Traefik to route to challenges on the host network

networks:
  ctf-network:
    name: ctf-instances
    driver: bridge

volumes:
  redis_data:
  postgres_data:
